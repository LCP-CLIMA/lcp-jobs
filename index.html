    <title>LCP Clima</title>
    <script>
      (function () {
        var VERSION = "v7-2026-11-25";
        try { if (localStorage.getItem("lcp-build") === VERSION) return; } catch (e) {}
        function finish() {
          try { localStorage.setItem("lcp-build", VERSION); } catch (e) {}
          var flag = "lcp-purged-" + VERSION;
          if (!sessionStorage.getItem(flag)) {
            sessionStorage.setItem(flag, "1");
            location.reload();
          }
        }
        var jobs = [];
        if (navigator.serviceWorker) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }));
        }
        if (window.caches) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          }));
        }
        Promise.all(jobs).then(finish, finish);
      })();
    </script>
